name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PD2ModelParser.sln

      - name: Build
        run: dotnet build PD2ModelParser.sln -c Release --no-restore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: payday2-model-tool
          path: PD2ModelParser/bin/Release/net10.0-windows/